<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка Telegram ID</title>
<style>
body{font:17px/1.55 system-ui,sans-serif;background:#f5f5f2;color:#202824;margin:0;padding:40px 20px}
main{max-width:540px;margin:6vh auto}h1{font-size:36px;line-height:1.15;letter-spacing:-1px}
form{padding:28px;background:white;border:1px solid #dce2dc;border-radius:16px}
label{display:block;font-weight:600}input{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #a9b5ac;border-radius:7px;font:inherit}
button{background:#215b42;color:white;border:0;border-radius:7px;padding:13px 20px;font:inherit;cursor:pointer;margin-top:16px}
.tgid-status{font-size:14px;min-height:24px;color:#47584d}input:focus-visible,button:focus-visible{outline:3px solid #9cbfa9;outline-offset:3px}
output{display:block;margin-top:16px;overflow-wrap:anywhere}small{color:#526158}
</style>
<main>
<h1>Найдём ваш Telegram</h1>
<p>Введите имя пользователя и перейдите к следующему полю. ID добавится к заявке автоматически.</p>
<form id="demo">
<label for="telegram">Telegram</label>
<input id="telegram" name="telegram_username" placeholder="@username или t.me/username" autocomplete="off" required>
<input type="hidden" name="telegram_id">
<button type="submit">Проверить заявку</button>
<output id="result" aria-live="polite"></output>
</form>
<p><small>Демонстрация показывает данные на этой странице. Она не отправляет заявку в CRM и не подтверждает владение аккаунтом.</small></p>
</main>
<script src="/widget.js" defer></script>
<script>
document.getElementById('demo').addEventListener('submit', function(event) {
  event.preventDefault();
  const data = new FormData(event.currentTarget);
  document.getElementById('result').textContent = 'Telegram ID: ' + data.get('telegram_id');
});
</script>
</html>
